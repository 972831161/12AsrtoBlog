        const tabsContainer = document.getElementById('tabs-container');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const currentSheetTitle = document.getElementById('current-sheet-title');
        
        let activeSheet = null;

        function init() {
            const sheets = Object.keys(sheetData);
            if(sheets.length === 0) return;
            
            let total = 0, danger = 0, normal = 0;
            for(let sheet of sheets) {
                let rows = sheetData[sheet];
                total += Math.max(0, rows.length - 2); 
                for(let rObj of rows) {
                    let r = rObj.cells;
                    let level = rObj.level;
                    if(level !== '正常') {
                        danger++;
                    } else {
                        if (r.join('').length > 10) normal++;
                    }
                }
            }
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-danger').innerText = danger;
            document.getElementById('stat-normal').innerText = Math.max(0, total - danger);

            sheets.forEach((sheet, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
                btn.innerText = sheet;
                btn.onclick = () => renderSheet(sheet, btn);
                tabsContainer.appendChild(btn);
            });
            
            renderSheet(sheets[0], tabsContainer.children[0]);
        }

        function applyFilter() {
            const showOnlyDanger = document.getElementById('filter-danger-only').checked;
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(tr => {
                if (showOnlyDanger) {
                    if (tr.classList.contains('row-zhongdian') || 
                        tr.classList.contains('row-zhide') || 
                        tr.classList.contains('row-yichang') ||
                        tr.innerHTML.includes('badge-warning') || 
                        tr.innerHTML.includes('badge-danger')) {
                        tr.style.display = '';
                    } else {
                        tr.style.display = 'none';
                    }
                } else {
                    tr.style.display = '';
                }
            });
        }

        function renderSheet(sheetName, triggerBtn) {
            Array.from(tabsContainer.children).forEach(btn => btn.classList.remove('active'));
            if(triggerBtn) triggerBtn.classList.add('active');

            currentSheetTitle.innerText = `📋 『${sheetName}』 的明细数据`;

            const rowsData = sheetData[sheetName];
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';
            
            tableBody.parentElement.classList.remove('fade-in');
            void tableBody.parentElement.offsetWidth; 
            tableBody.parentElement.classList.add('fade-in');

            if(!rowsData || rowsData.length === 0) return;

            let headerIndex = 0;
            for(let i=0; i<Math.min(3, rowsData.length); i++) {
                let rowText = rowsData[i].cells.join('');
                if(rowText.includes('标题') || rowText.includes('序号') || rowText.includes('问题描述') || rowText.includes('链接')) {
                    headerIndex = i;
                    break;
                }
            }

            const headers = rowsData[headerIndex].cells;
            const headerRow = document.createElement('tr');
            
            // 添加处理列头
            const thProc = document.createElement('th');
            thProc.innerText = '处理';
            headerRow.appendChild(thProc);

            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h || '';
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            for(let i = headerIndex + 1; i < rowsData.length; i++) {
                const r = rowsData[i].cells;
                const level = rowsData[i].level;
                
                if (r.join('').replace(/ /g, '') === '') continue;
                
                const tr = document.createElement('tr');
                const rowKey = `proc_${sheetName}_${i}`;
                const isProcessed = localStorage.getItem(rowKey) === 'true';
                
                if (isProcessed) tr.classList.add('processed');

                // 添加处理勾选框
                const tdProc = document.createElement('td');
                const chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.className = 'process-checkbox';
                chk.checked = isProcessed;
                chk.onchange = (e) => {
                    localStorage.setItem(rowKey, e.target.checked);
                    if (e.target.checked) {
                        tr.classList.add('processed');
                    } else {
                        tr.classList.remove('processed');
                    }
                };
                tdProc.appendChild(chk);
                tr.appendChild(tdProc);
                
                if(level === '重点检查') {
                    tr.classList.add('row-zhongdian');
                } else if(level === '值得关注') {
                    tr.classList.add('row-zhide');
                } else if(level === '异常未分类') {
                    tr.classList.add('row-yichang');
                }
                
                r.forEach(cell => {
                    const td = document.createElement('td');
                    let content = cell || '';
                    
                    if(content.trim() === '✓' || content.trim() === '√' || content.trim() === '正常') {
                        content = `<span class="badge badge-success">正常 (✓)</span>`;
                    } else if(content.trim() === '×' || content.trim() === 'x' || content.trim() === 'X' || content.trim() === '异常') {
                         if(level === '重点检查') {
                             content = `<span class="badge badge-danger">重点检查 (×)</span>`;
                         } else if(level === '值得关注') {
                             content = `<span class="badge badge-warning">值得关注 (×)</span>`;
                         } else {
                             content = `<span class="badge badge-danger">预警 (×)</span>`;
                         }
                    } else if(content.startsWith('http')) {
                        content = `<a href="${content}" target="_blank">🔗 点击前往</a>`;
                    } else {
                        content = content.replace(/\n/g, '<br>');
                    }
                    
                    td.innerHTML = content;
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            }

            applyFilter();
        }

        window.onload = init;
    </script>
