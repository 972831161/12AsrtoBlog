<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <base href="/ops-tool/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U&I Ops Intelligence | 品牌运营看板</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.font.im/css2?family=Inter:wght@300;400;600;800&display=swap">
</head>
<body data-theme="universe">
    <div class="app-container">
        <!-- 侧边录入栏 -->
        <aside class="sidebar">
            <div class="brand-switcher">
                <button id="btn-universe" class="active">宇宙自行车</button>
                <button id="btn-illusion">幻驰illusion</button>
            </div>
            
            <!-- 模块 1：账号表现录入 -->
            <div class="entry-pane stats-pane">
                <div class="pane-header">
                    <h2>品牌数据看板</h2>
                </div>
                <div class="input-group">
                    <label>记录日期</label>
                    <input type="date" id="in-record-date">
                </div>
                <div class="input-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>新增关注</label>
                        <input type="number" id="in-new-followers" placeholder="0">
                    </div>
                    <div style="flex: 1;">
                        <label>总粉丝数</label>
                        <input type="number" id="in-total-followers" placeholder="0">
                    </div>
                </div>
                
                <!-- 新增：双重评论计数器 -->
                <div class="counters-row">
                    <div class="comment-counter valid">
                        <label>有效评论 (意向)</label>
                        <div class="counter-control">
                            <span id="txt-valid-count">0</span>
                            <div class="counter-btns">
                                <button id="btn-sub-valid" type="button">-</button>
                                <button id="btn-add-valid" type="button">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="comment-counter invalid">
                        <label>无效评论 (杂音)</label>
                        <div class="counter-control">
                            <span id="txt-invalid-count">0</span>
                            <div class="counter-btns">
                                <button id="btn-sub-invalid" type="button">-</button>
                                <button id="btn-add-invalid" type="button">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="btn-update-stats" class="btn-secondary" style="margin-top: 5px; font-size: 13px;">同步今日总数据</button>
            </div>

            <hr style="opacity: 0.1;">

            <!-- 模块 2：具体咨询录入 -->
            <form id="entry-form" class="entry-pane">
                <div class="pane-header">
                    <h2>线索录入</h2>
                    <span class="source-tag" id="current-brand-label">Universe E-bike</span>
                </div>
                
                <div class="input-group">
                    <label>归属帖子 (来源 ID)</label>
                    <input type="text" id="in-source" placeholder="例如：悬崖边的三年" required>
                </div>
                
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="in-user" placeholder="小红书/微信 ID" required>
                </div>

                <div class="input-group">
                    <label>咨询车型 (选填)</label>
                    <input type="text" id="in-model" placeholder="例如：VAPOR, Mars">
                </div>
                
                <div class="input-group">
                    <label>内容正文</label>
                    <textarea id="in-content" rows="2" placeholder="复制评论或私信内容..."></textarea>
                </div>

                <div class="input-group">
                    <label>待加微信号 (如有)</label>
                    <input type="text" id="in-wechat" placeholder="提取到的微信 ID">
                </div>

                <div class="tag-selector">
                    <div class="tags">
                        <input type="checkbox" id="tag-purchase" value="purchase"><label for="tag-purchase">💰 咨询</label>
                        <input type="checkbox" id="tag-lead" value="lead"><label for="tag-lead">👤 引流</label>
                        <input type="checkbox" id="tag-pro" value="pro"><label for="tag-pro">📦 专业</label>
                        <input type="checkbox" id="tag-order" value="order"><label for="tag-order">🛒 订单</label>
                    </div>
                </div>

                <div class="form-actions" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                    <button type="submit" id="btn-submit-main" class="btn-submit">保存此条线索</button>
                    <button type="button" id="btn-cancel-edit" class="btn-secondary" style="display: none; background: rgba(255,255,255,0.1); color: #fff;">取消编辑</button>
                </div>
            </form>
        </aside>

        <!-- 主展示区 -->
        <main class="main-content">
            <header class="main-header">
                <div class="stat-card">
                    <span class="label">购买咨询占比</span>
                    <div class="value" id="stat-ratio">0%</div>
                    <div class="sub" id="stat-ratio-count">0 / 0</div>
                </div>
                <div class="stat-card">
                    <span class="label">今日新增关注</span>
                    <div class="value" id="stat-leads">0</div>
                    <div class="sub">账号粉丝增长</div>
                </div>
                <div class="stat-card">
                    <span class="label">账号总粉丝量</span>
                    <div class="value" id="stat-pro">0</div>
                    <div class="sub">品牌资产底色</div>
                </div>
                <div class="action-btns">
                    <button id="btn-export" class="btn-secondary">导出 CSV</button>
                    <button id="btn-reset" class="btn-danger">清空数据</button>
                </div>
            </header>

            <section class="data-section">
                <div class="section-title">
                    <h3>实时数据明细</h3>
                    <div class="filters">
                        <select id="filter-type">
                            <option value="all">所有分类</option>
                            <option value="purchase">💰 购买咨询</option>
                            <option value="lead">👤 微信引流</option>
                            <option value="pro">📦 专业问题</option>
                            <option value="order">🛒 订单查询</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>录入时间</th>
                                <th>来源归属</th>
                                <th>用户 ID</th>
                                <th>具体车型</th>
                                <th>线索分类</th>
                                <th>微信号码</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS 填充 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 弹窗通知 -->
    <div id="toast" class="toast">记录成功</div>

    <script src="app.js"></script>
</body>
</html>
